<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>營運看板 · 多事業線總覽</title>
<style>
  :root {
    /* 亮色系 · 淡蒂芬妮綠底 + 白卡片 */
    --bg: #d3ece7;
    --surface: #ffffff;
    --surface-2: #f4faf8;
    --surface-3: #e8f4f1;
    --line: #cfe3de;
    --line-soft: #e0eeea;
    --text: #1c3a36;
    --text-dim: #5a7d78;
    --text-faint: #8aa8a2;
    --accent: #ff7f6b;          /* 珊瑚粉強調 */
    --accent-ink: #ffffff;

    /* 事業線色帶 · 蒂芬妮綠深淺三階 */
    --resort: #0f9d92;
    --resort-bg: rgba(15,157,146,.08);
    --store: #3cc4b4;
    --store-bg: rgba(60,196,180,.08);
    --finance: #7ad4c8;
    --finance-bg: rgba(122,212,200,.10);

    /* 舊專案 · 與現行事業線區隔的三個色系 */
    --hardware: #d98a5a;
    --hardware-bg: rgba(217,138,90,.09);
    --senior: #9b8ec4;
    --senior-bg: rgba(155,142,196,.09);
    --aircon: #6aa9d9;
    --aircon-bg: rgba(106,169,217,.09);

    /* 服務等級 · 保留四色辨識 */
    --cos-expedite: #ef5350;
    --cos-fixed: #f5b301;
    --cos-standard: #90a4a0;
    --cos-intangible: #22a06b;

    --radius: 12px;
    --shadow: 0 6px 24px rgba(31,90,84,.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  body { min-height: 100vh; display: flex; flex-direction: column; }

  /* ============ 頂列 ============ */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 12px rgba(31,90,84,.06);
    position: sticky; top: 0; z-index: 50;
  }
  .brand { display: flex; flex-direction: column; }
  .brand h1 {
    font-size: 15px; font-weight: 700; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px; color: var(--text);
  }
  .brand h1::first-letter { color: var(--accent); }
  .brand .sub { font-size: 11px; color: var(--text-faint); letter-spacing: .3px; }
  .today { font-variant-numeric: tabular-nums; }

  .toolbar { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  button, select {
    font-family: inherit; font-size: 12.5px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 12px; cursor: pointer;
    transition: background .15s, border-color .15s, transform .05s;
    white-space: nowrap;
  }
  button:hover { background: var(--surface-3); border-color: #b6d5cf; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.primary:hover { background: #ff9483; }
  button.ghost { background: transparent; }
  button.danger:hover { border-color: var(--cos-expedite); color: var(--cos-expedite); }

  /* ============ 指標帶 ============ */
  .metrics {
    display: flex; gap: 0; padding: 0 20px;
    background: var(--surface); border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 8px rgba(31,90,84,.05);
    overflow-x: auto;
  }
  .metric {
    padding: 10px 18px 12px; border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column; gap: 2px; min-width: max-content;
  }
  .metric .label { font-size: 10.5px; color: var(--text-faint); letter-spacing: .4px; text-transform: uppercase; }
  .metric .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric .value small { font-size: 12px; font-weight: 500; color: var(--text-dim); }
  .metric.warn .value { color: var(--cos-expedite); }
  .metric.good .value { color: var(--cos-intangible); }

  /* ============ 泳道區 ============ */
  .lanes { flex: 1; overflow-y: auto; padding: 4px 0 40px; }

  .lane { border-bottom: 1px solid var(--line); }
  .lane-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px 8px; position: sticky; z-index: 10;
    background: var(--bg);
  }
  .lane-tag {
    width: 4px; height: 20px; border-radius: 2px; flex-shrink: 0;
  }
  .lane-head h2 { font-size: 14px; font-weight: 700; }
  .lane-head .focus {
    font-size: 11px; color: var(--text-faint); margin-left: 4px;
  }
  .lane-head .lane-wip {
    margin-left: auto; font-size: 11.5px; color: var(--text-dim);
    font-variant-numeric: tabular-nums; padding: 2px 9px;
    border: 1px solid var(--line); border-radius: 20px;
  }
  .lane-head .lane-wip.over { color: var(--cos-expedite); border-color: var(--cos-expedite); background: rgba(255,92,108,.08); }
  .lane-head button.collapse { padding: 3px 8px; font-size: 11px; }

  .columns {
    display: flex; gap: 10px; padding: 4px 20px 16px;
    overflow-x: auto; align-items: flex-start;
  }
  .column {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--radius); width: 232px; flex-shrink: 0;
    display: flex; flex-direction: column; max-height: 60vh;
  }
  .col-head {
    padding: 9px 11px; display: flex; align-items: center; gap: 7px;
    border-bottom: 1px solid var(--line-soft);
  }
  .col-head .name { font-size: 12.5px; font-weight: 600; }
  .col-head .count {
    font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums;
    margin-left: auto; padding: 1px 7px; border-radius: 10px; background: var(--surface-2);
  }
  .col-head .count.over { color: #fff; background: var(--cos-expedite); }
  .col-wip-hint { font-size: 10px; color: var(--text-faint); }

  .col-body {
    padding: 8px; display: flex; flex-direction: column; gap: 7px;
    overflow-y: auto; flex: 1; min-height: 48px;
  }
  .col-body.drag-over { background: var(--surface-2); outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 6px; }

  /* ============ 卡片 ============ */
  .card {
    background: var(--surface-2); border: 1px solid var(--line);
    border-left-width: 3px; border-radius: 7px; padding: 9px 10px;
    cursor: grab; position: relative; transition: border-color .12s, background .12s;
  }
  .card:hover { background: var(--surface-3); border-color: #b6d5cf; }
  .card.dragging { opacity: .4; cursor: grabbing; }
  .card.blocked { border-left-color: var(--cos-expedite) !important; }
  .card.blocked::after {
    content: "🚫"; position: absolute; top: 7px; right: 8px; font-size: 12px;
  }
  .card .title { font-size: 12.5px; font-weight: 600; line-height: 1.4; padding-right: 14px; word-break: break-word; }
  .card .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; align-items: center; }
  .chip {
    font-size: 10px; padding: 1px 7px; border-radius: 20px;
    background: var(--surface-3); color: var(--text-dim); white-space: nowrap;
  }
  .chip.type { border: 1px solid var(--line); }
  .card .age {
    font-size: 10px; color: var(--text-faint); font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  .card .age.stuck { color: var(--cos-expedite); font-weight: 600; }
  .cos-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .add-card {
    font-size: 11.5px; color: var(--text-faint); text-align: left;
    background: transparent; border: 1px dashed var(--line);
    padding: 6px 9px; border-radius: 6px; width: 100%;
  }
  .add-card:hover { color: var(--text); border-color: var(--accent); background: transparent; }

  /* ============ 空狀態 ============ */
  .empty-hint { color: var(--text-faint); font-size: 11px; text-align: center; padding: 8px 4px; }

  /* ============ Modal ============ */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,60,55,.42);
    display: none; align-items: center; justify-content: center; z-index: 100;
    backdrop-filter: blur(2px);
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; width: min(480px, 92vw); max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow);
  }
  .modal-head {
    padding: 15px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .modal-head h3 { font-size: 15px; }
  .modal-head .x { margin-left: auto; }
  .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 13px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11.5px; color: var(--text-dim); letter-spacing: .3px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 10px; color: var(--text); font-family: inherit; font-size: 13px;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-foot {
    padding: 13px 18px; border-top: 1px solid var(--line);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .modal-foot .del { margin-right: auto; }

  .cos-legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 2px; }
  .cos-legend span { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); }

  /* ============ Toast ============ */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #17403b; border: 1px solid #17403b; color: #eafaf6;
    padding: 10px 18px; border-radius: 8px; font-size: 12.5px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 200;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }

  /* 捲軸 */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #bcdad4; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #9ec7c0; }

  /* 行動作業 · 欄位切換器（只在手機出現） */
  .col-switch {
    display: none; gap: 6px; overflow-x: auto;
    padding: 0 12px 10px; -webkit-overflow-scrolling: touch;
  }
  .col-switch button {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--line);
    color: var(--text-dim); font-size: 12.5px; font-weight: 600;
    padding: 7px 13px; border-radius: 20px; font-family: inherit;
  }
  .col-switch button.on { background: var(--text); border-color: var(--text); color: #fff; }
  .col-switch button .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }

  @media (max-width: 1024px) {
    .columns { scroll-snap-type: x mandatory; }
    .column { scroll-snap-align: start; }
  }

  @media (max-width: 640px) {
    .metric .value { font-size: 16px; }
    header { flex-wrap: wrap; padding: 10px 12px; gap: 10px; }
    .toolbar { width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
    .metrics { padding: 0 12px; }
    .lane-head { padding: 10px 12px 8px; flex-wrap: wrap; row-gap: 4px; }
    .lane-head .focus { margin-left: 0; }
    .lane-head .lane-wip { margin-left: 0; }
    .col-switch { display: flex; }
    .columns { display: block; padding: 4px 12px 16px; }
    .column { width: auto; max-height: none; display: none; }
    .column.on { display: flex; }
    .col-body { max-height: 52vh; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>⬢ 營運看板 <span class="today" id="todayLabel"></span></h1>
    <span class="sub">多事業線總覽 · Portfolio Kanban</span>
  </div>
  <div class="toolbar">
    <button class="primary" onclick="openCardModal()">＋ 新增卡片</button>
    <button class="ghost" onclick="openManageModal()">⚙ 事業線 / 欄位</button>
    <button class="ghost" onclick="exportCSV()">匯出 CSV</button>
    <button class="ghost" onclick="exportJSON()">備份 JSON</button>
    <button class="ghost" onclick="document.getElementById('importFile').click()">還原 JSON</button>
    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJSON(event)">
  </div>
</header>

<div class="metrics" id="metrics"></div>

<div class="col-switch" id="colSwitch"></div>

<div class="lanes" id="lanes"></div>

<!-- 卡片編輯 Modal -->
<div class="modal-backdrop" id="cardModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="cardModalTitle">新增卡片</h3>
      <button class="ghost x" onclick="closeModal('cardModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>標題（動詞開頭，具體到能判斷做完沒）</label>
        <input id="f_title" placeholder="例：回覆包棟客的報價">
      </div>
      <div class="field-row">
        <div class="field">
          <label>事業線</label>
          <select id="f_lane"></select>
        </div>
        <div class="field">
          <label>目前欄位</label>
          <select id="f_status"></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>工作類型</label>
          <input id="f_type" placeholder="訂房 / 維修 / 內容…">
        </div>
        <div class="field">
          <label>服務等級</label>
          <select id="f_cos">
            <option value="standard">標準</option>
            <option value="expedite">加急（可插隊，同時限一張）</option>
            <option value="fixed">固定日期（有硬期限）</option>
            <option value="intangible">無形（長期會反咬）</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>進入日</label>
          <input type="date" id="f_entered">
        </div>
        <div class="field">
          <label>開始日（開工才填）</label>
          <input type="date" id="f_started">
        </div>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="f_blocked" style="width:auto" onchange="document.getElementById('blockRow').classList.toggle('hidden', !this.checked)">
          阻塞中（卡在別人身上）
        </label>
      </div>
      <div class="field hidden" id="blockRow">
        <label>阻塞原因</label>
        <input id="f_blockReason" placeholder="等零件 / 等客戶回覆 / 等簽核">
      </div>
      <div class="field">
        <label>完成定義（做完看這句，答案必須是明確的是或否）</label>
        <textarea id="f_dod" placeholder="例：三間房濾網換好、舊濾網丟棄、備品庫存已更新"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="ghost danger del hidden" id="deleteBtn" onclick="deleteCard()">刪除</button>
      <button class="ghost" onclick="closeModal('cardModal')">取消</button>
      <button class="primary" onclick="saveCard()">儲存</button>
    </div>
  </div>
</div>

<!-- 管理 Modal -->
<div class="modal-backdrop" id="manageModal">
  <div class="modal">
    <div class="modal-head">
      <h3>事業線與欄位設定</h3>
      <button class="ghost x" onclick="closeModal('manageModal')">✕</button>
    </div>
    <div class="modal-body" id="manageBody"></div>
    <div class="modal-foot">
      <button class="ghost danger" onclick="resetAll()">全部重設為預設</button>
      <button class="primary" onclick="closeModal('manageModal')">完成</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script id="appScript">
/* ================= 資料層 ================= */
const STORE_KEY = "ops_kanban_v1";
const todayISO = () => new Date().toISOString().slice(0, 10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const daysBetween = (a, b) => a && b ? Math.round((new Date(b) - new Date(a)) / 864e5) : null;

const COS = {
  standard:   { label: "標準",     color: "var(--cos-standard)" },
  expedite:   { label: "加急",     color: "var(--cos-expedite)" },
  fixed:      { label: "固定日期", color: "var(--cos-fixed)" },
  intangible: { label: "無形",     color: "var(--cos-intangible)" },
};

function defaultState() {
  const cols = () => [
    { id: "backlog", name: "待辦池", wip: 0 },
    { id: "ready",   name: "已細化", wip: 5 },
    { id: "doing",   name: "進行中", wip: 3 },
    { id: "review",  name: "待審",   wip: 3 },
    { id: "done",    name: "完成",   wip: 0 },
  ];
  return {
    globalWip: 5,
    lanes: [
      { id: "resort",  name: "沙八度假村", color: "var(--resort)",  focus: "訂房到退房 · 營運維護", collapsed: false, columns: cols() },
      { id: "store",   name: "無人桌遊店", color: "var(--store)",   focus: "補貨巡檢 · 設備維修",   collapsed: false, columns: cols() },
      { id: "finance", name: "家理E財務",  color: "var(--finance)", focus: "產品開發 · 客戶回饋",   collapsed: false, columns: cols() },
      { id: "hardware", name: "五金通 ERP",     color: "var(--hardware)", focus: "進銷存 · 家人日常使用",  collapsed: true, columns: cols() },
      { id: "senior",   name: "樂齡宅藥事管理", color: "var(--senior)",   focus: "商業模式驗證 · 未落地",  collapsed: true, columns: cols() },
      { id: "aircon",   name: "冷氣清潔",       color: "var(--aircon)",   focus: "案場排程 · 收款",        collapsed: true, columns: cols() },
    ],
    cards: seedCards(),
  };
}

function seedCards() {
  const t = todayISO();
  const ago = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
  return [
    { id: uid(), lane: "resort",  status: "doing",   title: "回覆週末包棟客的報價", type: "訂房", cos: "fixed",      entered: ago(3), started: ago(1), done: "", blocked: false, blockReason: "", dod: "報價單已寄出並確認對方收到" },
    { id: uid(), lane: "resort",  status: "review",  title: "更換三間客房冷氣濾網", type: "維修", cos: "standard",   entered: ago(10), started: ago(6), done: "", blocked: true, blockReason: "等濾網到貨", dod: "三間房濾網換好、舊品丟棄、庫存更新" },
    { id: uid(), lane: "resort",  status: "backlog", title: "季度設備保養排程",     type: "維護", cos: "intangible", entered: ago(2), started: "", done: "", blocked: false, blockReason: "", dod: "" },
    { id: uid(), lane: "store",   status: "doing",   title: "北屯店補貨與陳列調整", type: "補貨", cos: "standard",   entered: ago(4), started: ago(2), done: "", blocked: false, blockReason: "", dod: "缺貨品項補齊、新品上架" },
    { id: uid(), lane: "store",   status: "doing",   title: "西區店冷氣異音檢修",   type: "維修", cos: "expedite",   entered: ago(1), started: ago(1), done: "", blocked: false, blockReason: "", dod: "異音排除或叫修單已開" },
    { id: uid(), lane: "finance", status: "ready",   title: "匯入交易明細解析模組", type: "開發", cos: "standard",   entered: ago(5), started: "", done: "", blocked: false, blockReason: "", dod: "驗收標準已寫下並確認" },
    { id: uid(), lane: "finance", status: "backlog", title: "整理使用者回饋待辦",   type: "產品", cos: "standard",   entered: ago(1), started: "", done: "", blocked: false, blockReason: "", dod: "" },
    { id: uid(), lane: "resort",  status: "done",    title: "官網七月房價更新",     type: "內容", cos: "standard",   entered: ago(9), started: ago(8), done: ago(6), blocked: false, blockReason: "", dod: "六種房型價格已更新上線" },
    { id: uid(), lane: "store",   status: "done",    title: "六月營收對帳",         type: "行政", cos: "fixed",      entered: ago(12), started: ago(9), done: ago(7), blocked: false, blockReason: "", dod: "兩店帳目與金流對齊" },
  ];
}

const MIGRATION_KEY = "ops_kanban_migrations";
const MIGRATIONS = [
  { id: "2026-09-10-old-projects", lanes: ["hardware", "senior", "aircon"] },
];

let state = load();
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) {}
  return defaultState();
}

/* 每個 migration 只跑一次：補完之後再刪掉那條事業線，就不會被補回來 */
function migrate(loaded) {
  let done = [];
  try { done = JSON.parse(localStorage.getItem(MIGRATION_KEY)) || []; } catch (e) {}
  const defaults = defaultState().lanes;
  let changed = false;

  MIGRATIONS.forEach(m => {
    if (done.includes(m.id)) return;
    m.lanes.forEach(id => {
      if (loaded.lanes.some(l => l.id === id)) return;
      const def = defaults.find(l => l.id === id);
      if (def) { loaded.lanes.push(def); changed = true; }
    });
    done.push(m.id);
  });

  if (changed || done.length) {
    try {
      localStorage.setItem(MIGRATION_KEY, JSON.stringify(done));
      if (changed) localStorage.setItem(STORE_KEY, JSON.stringify(loaded));
    } catch (e) {}
  }
  return loaded;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast("儲存失敗，瀏覽器可能停用了本機儲存"); }
}

/* ================= 渲染 ================= */
function laneCards(laneId, status) {
  return state.cards.filter(c => c.lane === laneId && c.status === status);
}
function laneWipCount(laneId) {
  return state.cards.filter(c => c.lane === laneId && c.status !== "backlog" && c.status !== "done").length;
}

/* 手機一次只顯示一個欄位，跨所有事業線同步切換 */
let mobileCol = (state.lanes[0] && state.lanes[0].columns[0] || {}).id || "backlog";

function render() {
  document.getElementById("todayLabel").textContent = "· " + todayISO();
  renderMetrics();
  renderColSwitch();
  renderLanes();
  save();
}

function renderColSwitch() {
  const wrap = document.getElementById("colSwitch");
  const cols = (state.lanes[0] && state.lanes[0].columns) || [];
  if (!cols.some(c => c.id === mobileCol)) mobileCol = cols.length ? cols[0].id : "";
  wrap.innerHTML = "";
  cols.forEach(col => {
    const n = state.cards.filter(c => c.status === col.id).length;
    const b = document.createElement("button");
    b.type = "button";
    b.className = col.id === mobileCol ? "on" : "";
    b.innerHTML = `${esc(col.name)}<span class="n">${n}</span>`;
    b.onclick = () => { mobileCol = col.id; render(); };
    wrap.appendChild(b);
  });
}

function renderMetrics() {
  const active = state.cards.filter(c => c.status !== "done" && c.status !== "backlog");
  const wipNow = active.length;
  const doing = state.cards.filter(c => c.status === "doing").length;

  // 本週完成 + 週期時間
  const weekAgo = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const doneThisWeek = state.cards.filter(c => c.status === "done" && c.done >= weekAgo);
  const cycles = state.cards
    .filter(c => c.status === "done" && c.started && c.done)
    .map(c => daysBetween(c.started, c.done)).filter(n => n != null).sort((a, b) => a - b);
  const p85 = cycles.length ? cycles[Math.min(cycles.length - 1, Math.ceil(0.85 * cycles.length) - 1)] : null;

  const blocked = state.cards.filter(c => c.blocked && c.status !== "done").length;
  const stuck = state.cards.filter(c => {
    if (c.status === "done" || c.status === "backlog" || !c.started) return false;
    return daysBetween(c.started, todayISO()) > 14;
  }).length;
  const intangibleDone = doneThisWeek.filter(c => c.cos === "intangible").length;

  const m = [
    { label: "全域 WIP", value: wipNow, unit: "/ " + state.globalWip, warn: wipNow > state.globalWip },
    { label: "進行中", value: doing },
    { label: "本週完成", value: doneThisWeek.length },
    { label: "週期時間 85%", value: p85 == null ? "—" : p85, unit: p85 == null ? "" : "天" },
    { label: "阻塞中", value: blocked, warn: blocked > 0 },
    { label: "卡關 >14天", value: stuck, warn: stuck > 0 },
    { label: "本週無形類", value: intangibleDone, good: intangibleDone > 0, warn: intangibleDone === 0 },
  ];
  document.getElementById("metrics").innerHTML = m.map(x => `
    <div class="metric ${x.warn ? "warn" : ""} ${x.good ? "good" : ""}">
      <span class="label">${x.label}</span>
      <span class="value">${x.value}${x.unit ? ` <small>${x.unit}</small>` : ""}</span>
    </div>`).join("");
}

function renderLanes() {
  const wrap = document.getElementById("lanes");
  wrap.innerHTML = "";
  state.lanes.forEach(lane => {
    const wipCount = laneWipCount(lane.id);
    const laneEl = document.createElement("div");
    laneEl.className = "lane";
    laneEl.innerHTML = `
      <div class="lane-head" style="border-left:0">
        <span class="lane-tag" style="background:${lane.color}"></span>
        <h2 style="color:${lane.color}">${esc(lane.name)}</h2>
        <span class="focus">${esc(lane.focus || "")}</span>
        <button class="ghost collapse" onclick="toggleLane('${lane.id}')">${lane.collapsed ? "展開" : "收合"}</button>
        <span class="lane-wip ${wipCount > state.globalWip ? "over" : ""}">在製 ${wipCount}</span>
      </div>`;
    if (!lane.collapsed) {
      const cols = document.createElement("div");
      cols.className = "columns";
      lane.columns.forEach(col => cols.appendChild(renderColumn(lane, col)));
      laneEl.appendChild(cols);
    }
    wrap.appendChild(laneEl);
  });
}

function renderColumn(lane, col) {
  const cards = laneCards(lane.id, col.id);
  const over = col.wip > 0 && cards.length > col.wip;
  const el = document.createElement("div");
  el.className = "column" + (col.id === mobileCol ? " on" : "");
  el.dataset.status = col.id;
  el.innerHTML = `
    <div class="col-head">
      <span class="name">${esc(col.name)}</span>
      ${col.wip > 0 ? `<span class="col-wip-hint">上限 ${col.wip}</span>` : ""}
      <span class="count ${over ? "over" : ""}">${cards.length}</span>
    </div>`;
  const body = document.createElement("div");
  body.className = "col-body";
  body.dataset.lane = lane.id;
  body.dataset.status = col.id;
  body.addEventListener("dragover", onDragOver);
  body.addEventListener("dragleave", onDragLeave);
  body.addEventListener("drop", onDrop);

  if (cards.length === 0) {
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = "—";
    body.appendChild(hint);
  }
  cards.forEach(c => body.appendChild(renderCard(c)));

  const add = document.createElement("button");
  add.className = "add-card";
  add.textContent = "＋ 卡片";
  add.onclick = () => openCardModal(null, lane.id, col.id);
  body.appendChild(add);

  el.appendChild(body);
  return el;
}

function renderCard(c) {
  const el = document.createElement("div");
  el.className = "card" + (c.blocked ? " blocked" : "");
  el.draggable = true;
  el.dataset.id = c.id;
  el.style.borderLeftColor = COS[c.cos]?.color || "var(--cos-standard)";
  el.addEventListener("dragstart", onDragStart);
  el.addEventListener("dragend", onDragEnd);
  el.onclick = () => openCardModal(c.id);

  const ageBase = c.started || c.entered;
  const age = daysBetween(ageBase, todayISO());
  const isActive = c.status !== "done" && c.status !== "backlog";
  const stuck = isActive && c.started && age > 14;

  el.innerHTML = `
    <div class="title">${esc(c.title)}</div>
    <div class="meta">
      <span class="cos-dot" style="background:${COS[c.cos]?.color}"></span>
      ${c.type ? `<span class="chip type">${esc(c.type)}</span>` : ""}
      ${c.blocked && c.blockReason ? `<span class="chip" style="color:var(--cos-expedite)">${esc(c.blockReason)}</span>` : ""}
      ${age != null && c.status !== "done" ? `<span class="age ${stuck ? "stuck" : ""}">${age}天</span>` : ""}
      ${c.status === "done" && c.started && c.done ? `<span class="age">週期 ${daysBetween(c.started, c.done)}天</span>` : ""}
    </div>`;
  return el;
}

/* ================= 拖拉 ================= */
let dragId = null;
function onDragStart(e) { dragId = e.currentTarget.dataset.id; e.currentTarget.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; }
function onDragEnd(e) { e.currentTarget.classList.remove("dragging"); dragId = null; document.querySelectorAll(".drag-over").forEach(x => x.classList.remove("drag-over")); }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add("drag-over"); }
function onDragLeave(e) { e.currentTarget.classList.remove("drag-over"); }
function onDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  if (!dragId) return;
  const card = state.cards.find(c => c.id === dragId);
  if (!card) return;
  const newLane = e.currentTarget.dataset.lane;
  const newStatus = e.currentTarget.dataset.status;
  const prevStatus = card.status;

  // 自動記錄時間戳
  if (newStatus !== "backlog" && !card.started) card.started = todayISO();
  if (newStatus === "done" && !card.done) card.done = todayISO();
  if (newStatus !== "done") card.done = "";

  card.lane = newLane;
  card.status = newStatus;

  // WIP 超標提醒（不阻擋，只提示）
  const lane = state.lanes.find(l => l.id === newLane);
  const col = lane?.columns.find(cc => cc.id === newStatus);
  if (col && col.wip > 0) {
    const n = laneCards(newLane, newStatus).length;
    if (n > col.wip) toast(`⚠ ${lane.name}「${col.name}」已超過 WIP 上限 ${col.wip}（現在 ${n}）— 先推完再開新的`);
  }
  const gwip = laneWipCount(newLane);
  render();
}

/* ================= 卡片 Modal ================= */
let editingId = null;
function fillSelect(sel, items, val) {
  sel.innerHTML = items.map(i => `<option value="${i.id}">${esc(i.name)}</option>`).join("");
  if (val) sel.value = val;
}
function syncStatusOptions(laneId, val) {
  const lane = state.lanes.find(l => l.id === laneId) || state.lanes[0];
  fillSelect(document.getElementById("f_status"), lane.columns, val);
}
function openCardModal(id = null, presetLane = null, presetStatus = null) {
  editingId = id;
  document.getElementById("cardModalTitle").textContent = id ? "編輯卡片" : "新增卡片";
  document.getElementById("deleteBtn").classList.toggle("hidden", !id);
  fillSelect(document.getElementById("f_lane"), state.lanes, presetLane || state.lanes[0].id);
  const laneSel = document.getElementById("f_lane");
  laneSel.onchange = () => syncStatusOptions(laneSel.value);

  const c = id ? state.cards.find(x => x.id === id) : null;
  const laneVal = c ? c.lane : (presetLane || state.lanes[0].id);
  laneSel.value = laneVal;
  syncStatusOptions(laneVal, c ? c.status : (presetStatus || "backlog"));

  document.getElementById("f_title").value = c?.title || "";
  document.getElementById("f_type").value = c?.type || "";
  document.getElementById("f_cos").value = c?.cos || "standard";
  document.getElementById("f_entered").value = c?.entered || todayISO();
  document.getElementById("f_started").value = c?.started || "";
  document.getElementById("f_blocked").checked = !!c?.blocked;
  document.getElementById("f_blockReason").value = c?.blockReason || "";
  document.getElementById("blockRow").classList.toggle("hidden", !c?.blocked);
  document.getElementById("f_dod").value = c?.dod || "";

  openModal("cardModal");
  setTimeout(() => document.getElementById("f_title").focus(), 50);
}
function saveCard() {
  const title = document.getElementById("f_title").value.trim();
  if (!title) { toast("標題不能空白"); return; }
  const data = {
    lane: document.getElementById("f_lane").value,
    status: document.getElementById("f_status").value,
    title,
    type: document.getElementById("f_type").value.trim(),
    cos: document.getElementById("f_cos").value,
    entered: document.getElementById("f_entered").value || todayISO(),
    started: document.getElementById("f_started").value,
    blocked: document.getElementById("f_blocked").checked,
    blockReason: document.getElementById("f_blockReason").value.trim(),
    dod: document.getElementById("f_dod").value.trim(),
  };
  if (data.status !== "backlog" && !data.started) data.started = todayISO();
  if (editingId) {
    const c = state.cards.find(x => x.id === editingId);
    const wasDone = c.status === "done";
    Object.assign(c, data);
    if (c.status === "done" && !c.done) c.done = todayISO();
    if (c.status !== "done") c.done = "";
  } else {
    const card = { id: uid(), done: "", ...data };
    if (card.status === "done") card.done = todayISO();
    state.cards.push(card);
  }
  closeModal("cardModal");
  render();
  toast(editingId ? "已更新" : "已新增");
}
function deleteCard() {
  if (!editingId) return;
  if (!confirm("確定刪除這張卡片？")) return;
  state.cards = state.cards.filter(c => c.id !== editingId);
  closeModal("cardModal");
  render();
  toast("已刪除");
}

/* ================= 管理 Modal ================= */
function openManageModal() {
  const body = document.getElementById("manageBody");
  body.innerHTML = `
    <div class="field">
      <label>全域 WIP 上限（跨所有事業線的在製品總量，建議 3–5）</label>
      <input type="number" id="m_gwip" min="1" value="${state.globalWip}" onchange="state.globalWip=+this.value||5;render()">
    </div>
    <div class="cos-legend">
      ${Object.entries(COS).map(([k, v]) => `<span><span class="cos-dot" style="background:${v.color}"></span>${v.label}</span>`).join("")}
    </div>
    <hr style="border:0;border-top:1px solid var(--line)">
    ${state.lanes.map(lane => `
      <div class="field">
        <label style="color:${lane.color};font-weight:600">${esc(lane.name)}</label>
        <div class="field-row">
          <input value="${esc(lane.name)}" onchange="renameLane('${lane.id}',this.value)" placeholder="事業線名稱">
          <input value="${esc(lane.focus || "")}" onchange="setLaneFocus('${lane.id}',this.value)" placeholder="本週焦點說明">
        </div>
        <div style="font-size:11px;color:var(--text-faint);margin-top:4px">欄位 WIP 上限：</div>
        <div class="field-row" style="flex-wrap:wrap;gap:6px">
          ${lane.columns.map(col => `
            <div style="display:flex;flex-direction:column;gap:3px;min-width:64px">
              <span style="font-size:10px;color:var(--text-dim)">${esc(col.name)}</span>
              <input type="number" min="0" value="${col.wip}" style="padding:5px 7px"
                onchange="setColWip('${lane.id}','${col.id}',this.value)"
                title="0 = 不限">
            </div>`).join("")}
        </div>
      </div>`).join("")}
    <div style="font-size:11px;color:var(--text-faint);line-height:1.6">
      欄位 WIP 填 0 = 不設上限（待辦池與完成欄通常設 0）。<br>
      「進行中」建議個人設 3。超標不會被擋，但會跳紅字提醒你先推完再開新的。
    </div>`;
  openModal("manageModal");
}
function renameLane(id, v) { const l = state.lanes.find(x => x.id === id); if (l && v.trim()) { l.name = v.trim(); render(); } }
function setLaneFocus(id, v) { const l = state.lanes.find(x => x.id === id); if (l) { l.focus = v.trim(); render(); } }
function setColWip(laneId, colId, v) {
  const l = state.lanes.find(x => x.id === laneId);
  const col = l?.columns.find(c => c.id === colId);
  if (col) { col.wip = Math.max(0, +v || 0); render(); }
}
function toggleLane(id) { const l = state.lanes.find(x => x.id === id); if (l) { l.collapsed = !l.collapsed; render(); } }
function resetAll() {
  if (!confirm("這會清空所有卡片與設定，還原成預設範例。確定？")) return;
  state = defaultState();
  closeModal("manageModal");
  render();
  toast("已重設為預設");
}

/* ================= 匯出入 ================= */
function exportJSON() {
  download(`kanban-backup-${todayISO()}.json`, JSON.stringify(state, null, 2), "application/json");
  toast("JSON 備份已下載");
}
function importJSON(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.lanes || !data.cards) throw new Error("格式不符");
      if (!confirm("還原會覆蓋目前看板，確定？")) return;
      state = data;
      render();
      toast("已還原");
    } catch (e) { toast("檔案格式不正確，無法還原"); }
    ev.target.value = "";
  };
  reader.readAsText(file);
}
function exportCSV() {
  const laneName = id => state.lanes.find(l => l.id === id)?.name || id;
  const rows = [["card_id", "lane", "type", "class_of_service", "status", "entered_at", "started_at", "done_at", "blocked"]];
  state.cards.forEach(c => rows.push([
    c.title, laneName(c.lane), c.type, c.cos, c.status,
    c.entered || "", c.started || "", c.done || "", c.blocked ? "true" : "false",
  ]));
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(",")).join("\n");
  download(`kanban-cards-${todayISO()}.csv`, "\uFEFF" + csv, "text/csv");
  toast("CSV 已下載，可餵給 flow_metrics.py");
}
function download(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================= 工具 ================= */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}
document.querySelectorAll(".modal-backdrop").forEach(b => {
  b.addEventListener("click", e => { if (e.target === b) b.classList.remove("open"); });
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.querySelectorAll(".modal-backdrop.open").forEach(m => m.classList.remove("open"));
  if (e.key === "n" && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); openCardModal(); }
});

render();

</script>
